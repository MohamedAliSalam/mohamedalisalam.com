<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not found — Mohamed Ali Salam</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0F">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0B0B0F; --fg: #F4F4F6; --muted: #A3A3B0; --accent: #9B8CFF; --border: #26262F; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    background: var(--bg); color: var(--fg); font-family: 'Bricolage Grotesque', -apple-system, sans-serif;
    padding: 1.5rem; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 34rem; }
  .cmd { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 0.95rem; color: var(--muted); margin: 0 0 1.5rem; overflow-wrap: anywhere; }
  .cmd b { color: var(--accent); font-weight: 500; }
  h1 { font-weight: 800; font-variation-settings: 'wdth' 80, 'opsz' 96; font-size: clamp(2.5rem, 9vw, 4rem); letter-spacing: -0.03em; line-height: 1; margin: 0 0 1rem; }
  p { color: var(--muted); font-size: 1.0625rem; line-height: 1.6; margin: 0 0 2rem; }
  a.btn {
    display: inline-flex; padding: 0.875rem 1.75rem; border-radius: 999px; border: 1px solid var(--border);
    color: var(--fg); text-decoration: none; font-weight: 600; font-size: 0.95rem;
    transition: border-color 0.15s cubic-bezier(0.16, 1, 0.3, 1), color 0.15s cubic-bezier(0.16, 1, 0.3, 1);
  }
  a.btn:hover { border-color: var(--accent); color: var(--accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="cmd"><b>$</b> cat <span id="path">this-page</span><br>cat: No such file or directory</p>
  <h1>Nothing here.</h1>
  <p>This page doesn't exist, or it moved. The rest of the site is still where I left it.</p>
  <a class="btn" href="/">Back to the homepage</a>
</main>
<script>document.getElementById('path').textContent = location.pathname.replace(/^\//, '') || 'this-page';</script>
</body>
</html>
